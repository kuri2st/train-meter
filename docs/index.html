<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>train-meter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section class="line">
    <div class="line-head">
      <div id="lineName" class="line-name">路線未判定</div>
      <div id="clock" class="clock">--:--:--</div>
    </div>
    <div id="lineSub" class="line-sub"></div>
    <div id="lineAlts" class="chips"></div>
    <div id="typeChips" class="chips"></div>
  </section>

  <section class="speed">
    <div class="speed-main"><span id="speed">--</span><span class="unit">km/h</span></div>
    <div id="status" class="status">「開始」を押してください</div>
  </section>

  <section class="card chart-card">
    <div class="card-head"><span>速度履歴</span><span id="histLabel" class="muted"></span></div>
    <canvas id="chart"></canvas>
    <div class="chart-legend"><span><i class="raw"></i>測位ごと</span><span><i class="smooth"></i>なめらか（約4秒遅れ）</span></div>
  </section>

  <section class="card">
    <div class="card-head"><span>次駅</span><span id="dirLabel" class="muted"></span></div>
    <div class="next">
      <div id="nextName" class="next-name">--</div>
      <div class="next-nums">
        <div><span id="nextDist" class="big">--</span></div>
        <div class="muted">到着予想 <span id="nextEta">--</span></div>
      </div>
    </div>
    <ol id="following" class="following"></ol>
  </section>

  <section class="card" id="tunnelCard">
    <div class="card-head"><span>トンネル</span></div>
    <dl class="tunnel">
      <div data-key="tnInside"><dt>現在</dt><dd id="tnInside">--</dd></div>
      <div data-key="tnExit"><dt>出口まで</dt><dd id="tnExit">--</dd></div>
      <div data-key="tnNext"><dt>次のトンネル</dt><dd id="tnNext">--</dd></div>
      <div data-key="tnSection"><dt>次駅までの区間</dt><dd id="tnSection">--</dd></div>
    </dl>
  </section>

  <section class="card strip-card">
    <canvas id="strip"></canvas>
  </section>

  <footer>
    <button id="startBtn" class="primary">開始</button>
    <button id="settingsBtn">設定</button>
  </footer>
  <p id="attrib" class="attrib"></p>
</main>

<dialog id="settings">
  <form method="dialog">
    <h2>設定</h2>
    <fieldset>
      <legend>走行ログ（予想や判定の改善用）</legend>
      <label><input type="checkbox" id="setLog"> 記録する（「開始」〜「停止」を 1 件として保存）</label>
      <select id="logSess" class="log-sess"></select>
      <div class="log-btns">
        <button type="button" id="logExport">CSV で書き出し</button>
        <button type="button" id="logDel">削除</button>
        <button type="button" id="logDelAll">全削除</button>
      </div>
    </fieldset>
    <label class="row">速度履歴の長さ [秒]
      <input id="setHist" type="number" min="30" max="1800" step="10" inputmode="numeric">
    </label>
    <fieldset>
      <legend>トンネル情報の表示</legend>
      <label><input type="checkbox" id="set_tnInside"> トンネル内かどうかと名前・全長</label>
      <label><input type="checkbox" id="set_tnExit"> トンネル出口までの残り距離</label>
      <label><input type="checkbox" id="set_tnNext"> 次のトンネルまでの距離</label>
      <label><input type="checkbox" id="set_tnSection"> 次駅までのトンネル数・合計長</label>
    </fieldset>
    <button type="button" id="setTypes" class="wide">種別と停車駅の編集…</button>
    <div class="dlg-btns">
      <button value="cancel">閉じる</button>
      <button id="setSave" value="save" class="primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="typeEd" class="ted">
  <h2>種別と停車駅</h2>
  <div class="ted-line">
    <input id="tedFilter" type="search" placeholder="路線名で絞り込み">
    <select id="tedLine"></select>
  </div>
  <div id="tedTypes" class="chips"></div>
  <div id="tedEditRow" class="ted-edit">
    <input id="tedName" type="text" aria-label="種別名">
    <button type="button" id="tedUp" title="前へ">↑</button>
    <button type="button" id="tedAll">全停車</button>
    <button type="button" id="tedNone">全通過</button>
    <button type="button" id="tedDel">削除</button>
  </div>
  <p id="tedHint" class="muted"></p>
  <ol id="tedStations" class="route"></ol>
  <details class="ted-json">
    <summary>書き出し・読み込み</summary>
    <textarea id="tedJson" rows="5" placeholder="ここに貼り付けて「読み込み」"></textarea>
    <div class="dlg-btns">
      <span id="tedJsonMsg" class="muted"></span>
      <button type="button" id="tedExport">書き出し</button>
      <button type="button" id="tedImport">読み込み</button>
    </div>
  </details>
  <div class="dlg-btns">
    <button type="button" id="tedReset">初期値に戻す</button>
    <button type="button" id="tedCancel">閉じる</button>
    <button type="button" id="tedSave" class="primary">保存</button>
  </div>
</dialog>

<div id="loading" class="loading">路線データを読み込み中…</div>
<script src="app.js"></script>
</body>
</html>
